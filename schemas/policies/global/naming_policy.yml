version: 1

naming_policy:

  # =========================
  # GENERAL RULES
  # =========================

  lowercase_required: true
  hyphen_separator: true
  no_spaces_allowed: true

  description: "Tous les noms doivent être en minuscules, sans espaces, avec des tirets."

  # =========================
  # HOST NAMING
  # =========================

  host_naming_format: "<role>-<index>"
  examples:
    - bastion-1
    - app-1
    - db-1
    - ad-1
    - wazuh-1

  description_hosts: "Les hôtes doivent être nommés par rôle suivi d’un index."

  # =========================
  # FIREWALL NAMING
  # =========================

  firewall_naming_format: "<role>-<index>"
  examples:
    - pfsense-edge-1
    - pfsense-edge-2
    - pfsense-internal-1

  description_firewall: "Les firewalls doivent être identifiables par rôle et position."

  # =========================
  # ZONE NAMING
  # =========================

  allowed_zones:
    - wan
    - mgmt
    - dmz
    - users
    - ad
    - db
    - soc
    - backup
    - transit
    - interconnect

  description_zones: "Les noms de zones doivent respecter le catalogue défini."

  # =========================
  # NETWORK NAMING
  # =========================

  network_naming_format: "<zone>-net"
  examples:
    - mgmt-net
    - dmz-net
    - db-net

  description_networks: "Les réseaux doivent être nommés par zone."

  # =========================
  # ROLE NAMING
  # =========================

  allowed_roles:
    - bastion
    - reverse_proxy
    - app_server
    - db_server
    - ad_server
    - backup_server
    - wazuh_server
    - zabbix_server
    - user_workstation
    - admin_workstation
    - edge_firewall
    - edge_firewall_cluster
    - internal_firewall
    - internal_firewall_cluster

  description_roles: "Les rôles doivent correspondre aux rôles définis dans le catalogue."

  # =========================
  # CONSISTENCY
  # =========================

  naming_must_be_unique: true
  naming_must_be_predictable: true
  naming_must_match_roles: true

  description_consistency: "Les noms doivent être cohérents et refléter le rôle réel."

  # =========================
  # VALIDATION
  # =========================

  invalid_names_must_be_rejected: true
  unknown_roles_forbidden: true
  unknown_zones_forbidden: true

  description_validation: "Tout nom non conforme doit être rejeté."