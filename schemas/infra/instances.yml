version: 1

instances:

  # =========================
  # FIREWALL EDGE (HA)
  # =========================

  - name: pfsense-edge-1
    role: edge_firewall_cluster
    node_id: 1

    interfaces:
      - name: wan
        zone: wan
        ip: dhcp

      - name: mgmt
        zone: mgmt
        ip: 10.1.10.1

      - name: dmz
        zone: dmz
        ip: 10.1.30.1

      - name: transit
        zone: transit
        ip: 10.10.200.1

      - name: interconnect
        zone: interconnect
        ip: 10.20.200.1

    bootstrap:
      ssh_host_port: 2321

  - name: pfsense-edge-2
    role: edge_firewall_cluster
    node_id: 2

    interfaces:
      - name: wan
        zone: wan
        ip: dhcp

      - name: mgmt
        zone: mgmt
        ip: 10.1.10.2

      - name: dmz
        zone: dmz
        ip: 10.1.30.2

      - name: transit
        zone: transit
        ip: 10.10.200.2

      - name: interconnect
        zone: interconnect
        ip: 10.20.200.2

    bootstrap:
      ssh_host_port: 2322

  # =========================
  # FIREWALL INTERNE
  # =========================

  - name: pfsense-internal-1
    role: internal_firewall

    interfaces:
      - name: transit
        zone: transit
        ip: 10.10.200.5

      - name: soc
        zone: soc
        ip: 10.2.50.1

      - name: ad
        zone: ad
        ip: 10.3.60.1

      - name: db
        zone: db
        ip: 10.3.70.1

      - name: backup
        zone: backup
        ip: 10.4.80.1

    bootstrap:
      ssh_host_port: 2323

  # =========================
  # MGMT
  # =========================

  - name: bastion-1
    role: bastion
    zone: mgmt
    ip: 10.1.10.10

    bootstrap:
      ssh_host_port: 2301

  # =========================
  # DMZ
  # =========================

  - name: reverse-proxy-1
    role: reverse_proxy
    zone: dmz
    ip: 10.1.30.10

    bootstrap:
      ssh_host_port: 2302

  - name: app-1
    role: app_server
    zone: dmz
    ip: 10.1.30.20

    bootstrap:
      ssh_host_port: 2303

  # =========================
  # SOC
  # =========================

  - name: wazuh-1
    role: wazuh_server
    zone: soc
    ip: 10.2.50.10

    bootstrap:
      ssh_host_port: 2304

  - name: zabbix-1
    role: zabbix_server
    zone: soc
    ip: 10.2.50.20

    bootstrap:
      ssh_host_port: 2305

  # =========================
  # AD
  # =========================

  - name: ad-1
    role: ad_server
    zone: ad
    ip: 10.3.60.10

    bootstrap:
      ssh_host_port: 2306

  # =========================
  # DB
  # =========================

  - name: db-1
    role: db_server
    zone: db
    ip: 10.3.70.10

    bootstrap:
      ssh_host_port: 2307

  # =========================
  # BACKUP
  # =========================

  - name: backup-1
    role: backup_server
    zone: backup
    ip: 10.4.80.10

    bootstrap:
      ssh_host_port: 2308