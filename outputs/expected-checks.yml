vm_count: 9
required_machines:
  - pfsense-edge-1
  - pfsense-edge-2
  - pfsense-internal-1
  - bastion-1
  - reverse-proxy-1
  - ad-1
  - db-1
  - wazuh-1
  - zabbix-1
required_roles:
  - edge_firewall_cluster
  - internal_firewall
  - bastion
  - reverse_proxy
  - ad_server
  - db_server
  - wazuh_server
  - zabbix_server
policy_constraints:
  - database_must_be_isolated: true
  - admin_entrypoint_must_be_bastion: true
  - explicit_inter_zone_rules_only: true
  - dmz_cannot_reach_db_by_default: true
  - public_services_must_use_controlled_exposure: true
  - multi_vm_requires_segmentation: true
platform_policies_expected_when_ha_enabled:
  - policies/platform/pfsense_ha.yml
  - policies/platform/firewall_cluster.yml
zones_present:
  - wan
  - mgmt
  - dmz
  - soc
  - ad
  - db
  - transit
  - interconnect
notes:
  - Reverse proxy is the only intended public termination point
  - No direct WAN admin paths; admin goes via bastion in mgmt
  - HA interconnect network present between edge nodes
  - Internal firewall segments sensitive zones (soc, ad, db, backup)
